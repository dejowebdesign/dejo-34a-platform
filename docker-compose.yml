version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: dejo-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dejo34a}
      POSTGRES_USER: ${POSTGRES_USER:-dejo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/dejowebdesign/dejo-34a-backend:latest
    container_name: dejo-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: http://localhost:8080
      NODE_ENV: production
    command: >
      sh -c "npx prisma migrate deploy --schema database/prisma/schema.prisma &&
             node apps/backend/dist/main.js"
    ports:
      - '3020:3000'

  frontend:
    image: ghcr.io/dejowebdesign/dejo-34a-frontend:latest
    container_name: dejo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  postgres_data:
