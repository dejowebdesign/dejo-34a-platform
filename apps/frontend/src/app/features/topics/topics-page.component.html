<section class="page-header"><div><h1>Themengebiete</h1><p>Strukturieren Sie Themen und Unterthemen für die Lerninhalte.</p></div><button mat-flat-button disabled>Neues Themengebiet</button></section>
<mat-form-field appearance="outline" class="filter"><mat-label>Filtern</mat-label><input matInput (input)="applyFilter($any($event.target).value)" placeholder="Themengebiet suchen" /></mat-form-field>
<div class="table-wrapper"><table mat-table [dataSource]="dataSource" matSort>
  <ng-container matColumnDef="order"><th mat-header-cell *matHeaderCellDef mat-sort-header>Reihenfolge</th><td mat-cell *matCellDef="let row">{{ row.order }}</td></ng-container>
  <ng-container matColumnDef="title"><th mat-header-cell *matHeaderCellDef mat-sort-header>Titel</th><td mat-cell *matCellDef="let row">{{ row.title }}</td></ng-container>
  <ng-container matColumnDef="description"><th mat-header-cell *matHeaderCellDef>Beschreibung</th><td mat-cell *matCellDef="let row">{{ row.description }}</td></ng-container>
  <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Aktion</th><td mat-cell *matCellDef="let row"><a mat-button [routerLink]="['/topics', row.id]">Details</a></td></ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table></div><mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
