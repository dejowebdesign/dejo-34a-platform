<section class="page-header"><div><h1>Paragraph-Historie</h1><p>Alle unveränderbaren Textversionen eines Paragraphen.</p></div></section>
@if (versions$ | async; as versions) {
<div class="table-wrapper"><table mat-table [dataSource]="versions">
  <ng-container matColumnDef="version"><th mat-header-cell *matHeaderCellDef>Version</th><td mat-cell *matCellDef="let row">{{ row.version }}</td></ng-container>
  <ng-container matColumnDef="importedAt"><th mat-header-cell *matHeaderCellDef>Importzeitpunkt</th><td mat-cell *matCellDef="let row">{{ row.importedAt }}</td></ng-container>
  <ng-container matColumnDef="checksum"><th mat-header-cell *matHeaderCellDef>Prüfsumme</th><td mat-cell *matCellDef="let row">{{ row.checksum }}</td></ng-container>
  <ng-container matColumnDef="difference"><th mat-header-cell *matHeaderCellDef>Unterschied</th><td mat-cell *matCellDef="let row">Vergleich wird vorbereitet</td></ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table></div>
}
