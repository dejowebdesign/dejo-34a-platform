<section class="page-header">
  <div>
    <h1>Paragraphen</h1>
    <p>Verwalten Sie Paragraphen und ihre Versionshistorie.</p>
  </div>
  <button mat-flat-button disabled>Neuer Paragraph</button>
</section>
<mat-form-field appearance="outline" class="filter"
  ><mat-label>Filtern</mat-label
  ><input matInput (input)="applyFilter($any($event.target).value)" placeholder="Paragraph suchen"
/></mat-form-field>
<div class="table-wrapper">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="number"
      ><th mat-header-cell *matHeaderCellDef mat-sort-header>Nummer</th>
      <td mat-cell *matCellDef="let row">{{ row.number }}</td></ng-container
    >
    <ng-container matColumnDef="title"
      ><th mat-header-cell *matHeaderCellDef mat-sort-header>Titel</th>
      <td mat-cell *matCellDef="let row">{{ row.title }}</td></ng-container
    >
    <ng-container matColumnDef="law"
      ><th mat-header-cell *matHeaderCellDef mat-sort-header>Gesetz</th>
      <td mat-cell *matCellDef="let row">{{ row.law }}</td></ng-container
    >
    <ng-container matColumnDef="currentVersion"
      ><th mat-header-cell *matHeaderCellDef mat-sort-header>Aktuelle Version</th>
      <td mat-cell *matCellDef="let row">{{ row.currentVersion }}</td></ng-container
    >
    <ng-container matColumnDef="actions"
      ><th mat-header-cell *matHeaderCellDef>Aktion</th>
      <td mat-cell *matCellDef="let row">
        <a mat-button [routerLink]="['/paragraphs', row.id]">Details</a
        ><a mat-button [routerLink]="['/paragraphs', row.id, 'history']">Historie</a>
      </td></ng-container
    >
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
<mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
