<section class="page-header"><div><h1>Gesetze</h1><p>Verwalten Sie Rechtsquellen und deren Versionen.</p></div><button mat-flat-button disabled>Neues Gesetz</button></section>
<mat-form-field appearance="outline" class="filter"><mat-label>Filtern</mat-label><input matInput (input)="applyFilter($any($event.target).value)" placeholder="Gesetz suchen" /></mat-form-field>
<div class="table-wrapper"><table mat-table [dataSource]="dataSource" matSort>
  <ng-container matColumnDef="abbreviation"><th mat-header-cell *matHeaderCellDef mat-sort-header>Abkürzung</th><td mat-cell *matCellDef="let row">{{ row.abbreviation }}</td></ng-container>
  <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th><td mat-cell *matCellDef="let row">{{ row.name }}</td></ng-container>
  <ng-container matColumnDef="version"><th mat-header-cell *matHeaderCellDef mat-sort-header>Version</th><td mat-cell *matCellDef="let row">{{ row.version }}</td></ng-container>
  <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Aktion</th><td mat-cell *matCellDef="let row"><a mat-button [routerLink]="['/laws', row.id]">Details</a></td></ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table></div><mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
