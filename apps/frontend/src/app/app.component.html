<mat-sidenav-container class="shell">
  <mat-sidenav [opened]="opened()" mode="side" class="navigation">
    <div class="brand"><span>dejo</span><small>§34a Plattform</small></div>
    <nav aria-label="Hauptnavigation">
      @for (item of navigation; track item.route) {
        <a mat-button [routerLink]="item.route" routerLinkActive="active-link">
          <mat-icon>{{ item.icon }}</mat-icon
          ><span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button aria-label="Navigation umschalten" (click)="opened.set(!opened())">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">dejo-34a-platform</span>
    </mat-toolbar>
    <main><router-outlet /></main>
  </mat-sidenav-content>
</mat-sidenav-container>
